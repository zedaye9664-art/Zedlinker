<section id="submit" class="section">
  <div class="container">

    <div class="section-title">
      <h2>Submit Your Link</h2>
      <p>Add your WhatsApp or Telegram group/channel to Zed WhatsApp Links.</p>
    </div>

    <div class="form-card">

      <form id="submitForm">

        <!-- Link Type -->
        <div class="form-group">
          <label for="linkType">Link Type</label>

          <select id="linkType" required>
            <option value="">Select Link Type</option>
            <option value="WhatsApp Group">WhatsApp Group</option>
            <option value="WhatsApp Channel">WhatsApp Channel</option>
            <option value="Telegram Group">Telegram Group</option>
            <option value="Telegram Channel">Telegram Channel</option>
          </select>
        </div>


        <!-- Name -->
        <div class="form-group">
          <label for="linkName">Group / Channel Name</label>

          <input
            type="text"
            id="linkName"
            placeholder="Enter group or channel name"
            required
          >
        </div>


        <!-- Link -->
        <div class="form-group">
          <label for="groupLink">Group / Channel Link</label>

          <input
            type="url"
            id="groupLink"
            placeholder="https://chat.whatsapp.com/..."
            required
          >
        </div>


        <!-- Category -->
        <div class="form-group">

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBpJKcOaqc99cX-sxCTQPwPYIQD7IWmwg",

    authDomain:
      "zedlinker-new.firebaseapp.com",

    projectId:
      "zedlinker-new",

    storageBucket:
      "zedlinker-new.firebasestorage.app",

    messagingSenderId:
      "1055785931642",

    appId:
      "1:1055785931642:web:8040da3ec6c0e121103cc3"

  };


  /* =========================
     INITIALIZE FIREBASE
  ========================= */

  const app =
    initializeApp(firebaseConfig);


  const db =
    getFirestore(app);


  /* =========================
     GLOBAL DATA
  ========================= */

  let allListings = [];

  let currentFilter = "all";

  let currentCategory = "all";


  /* =========================
     PLAN PRICES
  ========================= */

  const planPrices = {

    "WhatsApp Group": {

      Free: 0,
      Basic: 299,
      Pro: 499,
      Premium: 1099,
      Elite: 1499

    },

    "WhatsApp Channel": {

      Free: 0,
      Basic: 399,
      Pro: 599,
      Premium: 1199,
      Elite: 1599

    },

    "Telegram Group": {

      Free: 0,
      Basic: 299,
      Pro: 499,
      Premium: 1099,
      Elite: 1499

    },

    "Telegram Channel": {

      Free: 0,
      Basic: 399,
      Pro: 599,
      Premium: 1199,
      Elite: 1599

    }

  };


  /* =========================
     PLAN PRIORITY
  ========================= */

  const planPriority = {

    Elite: 5,
    Premium: 4,
    Pro: 3,
    Basic: 2,
    Free: 1

  };


  /* =========================
     SAFE TEXT
  ========================= */

  function escapeHTML(value) {

    if (value === undefined || value === null) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     SAFE URL
  ========================= */

  function safeURL(value) {

    try {

      const url =
        new URL(value);

      if (
        url.protocol === "https:" ||
        url.protocol === "http:"
      ) {

        return url.href;

      }

    } catch (error) {}

    return "#";

  }


  /* =========================
     SHOW TOAST
  ========================= */

  function showToast(type, message) {

    const success =
      document.getElementById("successMessage");

    const error =
      document.getElementById("errorMessage");

    if (type === "success") {

      success.classList.add("show");

      error.classList.remove("show");

      setTimeout(() => {

        success.classList.remove("show");

      }, 5000);

    } else {

      document.getElementById(
        "errorMessageText"
      ).textContent = message;

      error.classList.add("show");

      success.classList.remove("show");

      setTimeout(() => {

        error.classList.remove("show");

      }, 6000);

    }

  }


  /* =========================
     LOAD APPROVED LINKS
  ========================= */

  const listingsQuery =
    query(
      collection(db, "listings"),
      where("status", "==", "approved")
    );


  onSnapshot(
    listingsQuery,

    (snapshot) => {

      allListings =
        snapshot.docs.map(doc => ({

          id: doc.id,
          ...doc.data()

        }));


      allListings.sort((a, b) => {

        const planA =
          planPriority[a.plan] || 0;

        const planB =
          planPriority[b.plan] || 0;

        if (planB !== planA) {

          return planB - planA;

        }

        return (
          (a.name || "")
            .toLowerCase()
            .localeCompare(
              (b.name || "").toLowerCase()
            )
        );

      });


      renderListings();

      renderFeatured();

      updateStatistics();


      const loading =
        document.querySelector(".loading");

      if (loading) {

        loading.style.display = "none";

      }

    },

    (error) => {

      console.error(
        "Firebase Error:",
        error
      );

      showToast(
        "error",
        "Unable to load links. Please try again."
      );

    }

  );


  /* =========================
     RENDER LISTINGS
  ========================= */

  function renderListings() {

    const container =
      document.getElementById("listingsGrid");

    if (!container) {
      return;
    }


    let filtered =
      [...allListings];


    if (currentFilter !== "all") {

      filtered =
        filtered.filter(
          item =>
            item.type === currentFilter
        );

    }


    if (currentCategory !== "all") {

      filtered =
        filtered.filter(
          item =>
            item.category === currentCategory
        );

    }


    if (filtered.length === 0) {

      container.innerHTML = `

        <div class="empty-state">

          <div class="empty-icon">
            🔍
          </div>

          <h3>
            No Links Found
          </h3>

          <p>
            No approved links are available for
            this selection yet.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML =
      filtered.map(item => {

        const name =
          escapeHTML(item.name);

        const type =
          escapeHTML(item.type);

        const category =
          escapeHTML(item.category);

        const description =
          escapeHTML(
            item.description ||
            "Join this community."
          );

        const plan =
          escapeHTML(
            item.plan || "Free"
          );

        const url =
          safeURL(item.link);


        return `

          <article class="listing-card">

            <div class="listing-card-top">

              <span class="listing-type">
                ${type}
              </span>

              <span class="listing-plan plan-${plan.toLowerCase()}">
                ${plan}
              </span>

            </div>


            <h3 class="listing-title">
              ${name}
            </h3>


            <span class="listing-category">
              ${category}
            </span>


            <p class="listing-description">
              ${description}
            </p>


            <a
              href="${url}"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-primary join-btn"
            >
              Join Now
            </a>

          </article>

        `;

      }).join("");

  }


</script>

  /* =========================
     SEARCH FUNCTION
  ========================= */

  const searchInput =
    document.getElementById("searchInput");


  if (searchInput) {

    searchInput.addEventListener(
      "input",
      function () {

        const searchTerm =
          this.value
            .trim()
            .toLowerCase();


        const container =
          document.getElementById("listingsGrid");


        if (!container) {
          return;

            );

        if (currentCategory !== "all") {

            );

        }

                item.description,
                item.plan

              ]
                .filter(Boolean)
                .join(" ")

     RENDER SEARCH RESULTS

      document.getElementById("listingsGrid");

          escapeHTML(item.type);

          );

            </p>


            <a
              href="${url}"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-primary join-btn"
            >
              Join Now
            </a>

          </article>

        `;

      }).join("");

  }


  /* =========================
     FILTER BUTTONS
  ========================= */

  const filterButtons =
    document.querySelectorAll(
      ".filter-btn"
    );


  filterButtons.forEach(button => {

    button.addEventListener(
      "click",
      function () {

        filterButtons.forEach(btn => {

          btn.classList.remove(
            "active"
          );

        });


        this.classList.add(
          "active"
        );


        currentFilter =
          this.dataset.filter ||
          "all";


        renderListings();

      }
    );

  });


  /* =========================
     CATEGORY BUTTONS
  ========================= */

  const categoryButtons =
    document.querySelectorAll(
      ".category-card"
    );


  categoryButtons.forEach(button => {

    button.addEventListener(
      "click",
      function () {

        currentCategory =
          this.dataset.category ||
          "all";


        const listingsSection =
          document.getElementById(
            "directory"
          );


        if (listingsSection) {

          listingsSection.scrollIntoView({
            behavior: "smooth"
          });

        }


        renderListings();

      }
    );

  });

     PLAN TYPE BUTTONS
  ========================= */

  const planTypeButtons =

    );

        );

        updatePlanPrices(
          selectedType
        );

      }
    );

  });


  /* =========================
     UPDATE PLAN PRICES
  ========================= */

  function updatePlanPrices(type) {

    const prices =
      planPrices[type];


    if (!prices) {
      return;
    }


    document
      .querySelectorAll(
        ".dynamic-price"
      )
      .forEach(element => {

        const plan =
          element.dataset.planPrice;


        if (
          prices[plan] !== undefined
        ) {

          element.textContent =
            prices[plan];

        }

      });

  }


  /* =========================
     SELECT PLAN BUTTONS
  ========================= */

    document.querySelectorAll(
      ".select-plan"
    );

      function () {

          this.dataset.plan;


        const planSelect =

          );


        if (planSelect) {

        }


        const submitSection =

          );


        if (submitSection) {

          submitSection.scrollIntoView({
            behavior: "smooth"
          });

        }


        updateSelectedPlanInfo();

      }
    );

     LINK TYPE CHANGE
  ========================= */

  const linkType =
    document.getElementById(
      "linkType"
    );


  if (linkType) {

      function () {

        updatePlanPrices(
          this.value
        );

      }
    );

  }


  /* =========================
     PLAN CHANGE
  ========================= */

  const planSelect =
    document.getElementById(
      "plan"
    );


  if (planSelect) {

    planSelect.addEventListener(
      "change",
      updateSelectedPlanInfo
    );

  }


  /* =========================
     SELECTED PLAN INFO
  ========================= */

  function updateSelectedPlanInfo() {

    const type =
      document.getElementById(
        "linkType"
      )?.value;


    const plan =
      document.getElementById(
        "plan"
      )?.value;


    const info =
      document.getElementById(
        "selectedPlanInfo"
      );


    if (!info) {
      return;
    }


    if (!type || !plan) {

      info.textContent =
        "Select a plan to see the price.";

      return;

    }


    const price =
      planPrices[type]?.[plan] ?? 0;


    if (price === 0) {

      info.innerHTML = `
        <strong>Free Plan</strong>
        <br>
        Your listing will be available
        for 1 month after approval.
      `;

      return;

    }


    info.innerHTML = `
      <strong>
        ${escapeHTML(plan)} Plan
      </strong>

      <br>

      Price:
      <strong>
        PKR ${price.toLocaleString()}
      </strong>

      <br>

      on WhatsApp for payment.
    `;

  }

  ========================= */

    document.getElementById(

    );

        event.preventDefault();


        const submitButton =
          document.getElementById(
            "submitLinkBtn"
          );


        const type =
          document.getElementById(
            "linkType"
          ).value.trim();


        const name =
          document.getElementById(
            "linkName"
          ).value.trim();


        const link =
          document.getElementById(
            "groupLink"
          ).value.trim();


        const category =
          document.getElementById(
            "category"
          ).value.trim();


        const email =
          document.getElementById(
            "email"
          ).value.trim();


        const whatsappNumber =
          document.getElementById(
            "whatsappNumber"
          ).value.trim();


        const description =
          document.getElementById(
            "description"
          ).value.trim();


        const plan =
          document.getElementById(
            "plan"
          ).value.trim();


        /* =========================
           BASIC VALIDATION
        ========================= */

        if (
          !type ||
          !name ||
          !link ||
          !category ||
          !email ||
          !whatsappNumber ||
          !description ||
          !plan
        ) {

          showToast(
            "error",
            "Please complete all required fields."
          );

          return;

        }


        /* =========================
           URL VALIDATION
        ========================= */

        let validURL;

        try {

          validURL =
            new URL(link);

          if (
            validURL.protocol !==
              "https:" &&
            validURL.protocol !==
              "http:"
          ) {

            throw new Error(
              "Invalid URL"
            );

          }

        } catch (error) {

          showToast(
            "error",
            "Please enter a valid group or channel link."
          );

          return;

        }


        /* =========================
           DISABLE BUTTON
        ========================= */

        submitButton.disabled =
          true;

        submitButton.textContent =
          "Submitting...";


        try {

          const price =
            planPrices[type]?.[plan] ?? 0;


          /* =========================
             FIRESTORE DOCUMENT
          ========================= */

          await addDoc(
            collection(
              db,
              "listings"
            ),
            {

              type: type,

              name: name,

              link: validURL.href,

              category: category,

              email: email,

              whatsappNumber:
                whatsappNumber,

              description:
                description,

              plan: plan,

              price: price,

              status: "pending",

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            }
          );


          /* =========================
             SUCCESS
          ========================= */

          submitForm.reset();

          updateSelectedPlanInfo();


          showToast(
            "success",
            "Your link has been submitted for admin approval."
          );


          /* =========================
             PAID PLAN CONTACT
          ========================= */

          if (price > 0) {

            setTimeout(() => {

              const confirmContact =

<script type="module">

  window.addEventListener(
    "load",
    function () {

      document.body.classList.add(
        "loaded"
      );

        document.querySelector(
          ".loading"
        );


      if (loading) {

        setTimeout(() => {

          loading.style.display =
            "none";

        }, 500);

      }

    }
  );


  /* =========================
     HANDLE BROWSER BACK
  ========================= */

  window.addEventListener(
    "popstate",
    function () {

      const hash =
        window.location.hash;


      if (hash) {

        const target =
          document.querySelector(
            hash
          );


        if (target) {

          setTimeout(() => {

            target.scrollIntoView({
              behavior: "smooth"
            });

          }, 50);

        }

      }

    }
  );


  /* =========================
     CLOSE MOBILE MENU
     WHEN CLICKING OUTSIDE
  ========================= */

  document.addEventListener(
    "click",
    function (event) {

      const navMenu =
        document.getElementById(
          "navMenu"
        );


      const menuToggle =
        document.getElementById(
          "menuToggle"
        );


      if (
        !navMenu ||
        !menuToggle
      ) {

        return;

      }


      const clickedInsideMenu =
        navMenu.contains(
          event.target
        );


      const clickedToggle =
        menuToggle.contains(
          event.target
        );


      if (
        !clickedInsideMenu &&
        !clickedToggle
      ) {

        navMenu.classList.remove(
          "active"
        );

        menuToggle.classList.remove(
          "active"
        );

      }

    }
